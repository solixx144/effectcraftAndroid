name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          # Accept all available SDK licenses. Some runner images print lengthy
          # license text; feed affirmative responses explicitly.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "License acceptance returned $LICENSE_STATUS; continuing to package install for diagnostics."
          fi

          # Pipe acceptance to install as well, in case a package license is
          # newly presented during installation.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --verbose --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$INSTALL_STATUS" -ne 0 ]]; then
            echo "ERROR: sdkmanager package installation failed with exit code $INSTALL_STATUS"
            exit "$INSTALL_STATUS"
          fi

      - name: Verify Android module directory
        run: test -f android/app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
