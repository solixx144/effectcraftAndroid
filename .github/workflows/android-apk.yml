name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runner image already contains the Android SDK and its
      # accepted license files. Do not run `sdkmanager --licenses` here: on
      # some runner images that command exits 1 even after printing licenses.
      - name: Locate and verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK_ROOT"

          REQUIRED_DIRS=(
            "$SDK_ROOT/platform-tools"
            "$SDK_ROOT/platforms/android-36"
            "$SDK_ROOT/build-tools/36.0.0"
          )

          MISSING=()
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [[ ! -d "$dir" ]]; then
              MISSING+=("$dir")
            fi
          done

          if (( ${#MISSING[@]} > 0 )); then
            echo "ERROR: Required Android SDK packages are missing:"
            printf ' - %s\n' "${MISSING[@]}"
            echo "Installed SDK packages on this runner:"
            find "$SDK_ROOT" -maxdepth 3 -type d \( -path '*/platforms/*' -o -path '*/build-tools/*' \) | sort || true
            echo "SDK license files present:"
            if [[ -d "$SDK_ROOT/licenses" ]]; then
              find "$SDK_ROOT/licenses" -maxdepth 1 -type f -printf '%f\n' | sort
            else
              echo "No licenses directory found"
            fi
            exit 1
          fi

          echo "Android SDK packages required by this project are present."

      - name: Verify Android project files
        run: |
          test -f settings.gradle.kts
          test -f android/app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
